<!doctype html><meta charset="utf-8"><h1>Replay browser acceptance</h1><pre id="result">Running</pre><iframe src="product.html" id="product"></iframe>
<script type="module">
import {WorkflowStore} from './WorkflowStore.js';
import {executeReplayStep} from './ReplayStepExecutor.js';
const results=[];const assert=(condition,name)=>{if(!condition)throw Error(name);results.push('PASS '+name);};
try{
await new Promise((resolve,reject)=>{const r=indexedDB.open('BrowserOnly-workflows',1);r.onupgradeneeded=()=>{for(const name of ['workflows','versions','runs','stepRuns']){const s=r.result.createObjectStore(name,{keyPath:'id'});if(name==='workflows'){s.createIndex('updatedAt','updatedAt');s.createIndex('status','status');}if(name==='versions')s.createIndex('workflowId','workflowId');if(name==='runs'){s.createIndex('workflowId','workflowId');s.createIndex('startedAt','startedAt');}if(name==='stepRuns')s.createIndex('runId','runId');}};r.onsuccess=()=>{const tx=r.result.transaction('workflows','readwrite');tx.objectStore('workflows').put({id:'legacy-before-upgrade',status:'active',activeVersionId:'legacy-v1',updatedAt:1});tx.oncomplete=()=>{r.result.close();resolve();};tx.onerror=()=>reject(tx.error);};r.onerror=()=>reject(r.error);});
const store=WorkflowStore.getInstance();assert((await store.getWorkflow('legacy-before-upgrade')).activeVersionId==='legacy-v1','v1 record survives schema upgrade');const old={id:'old',status:'active',activeVersionId:'v1',updatedAt:1};await store.saveWorkflow(old);assert((await store.getWorkflow('old')).activeVersionId==='v1','legacy data survives additive database upgrade');
const v={id:'v2',workflowId:'old',version:2,steps:[],finalAssertions:[]};await store.activateVersion(old,v);assert((await store.getWorkflow('old')).activeVersionId==='v2','atomic activation');
const invalid={...v,id:'bad',steps:()=>{}};try{await store.activateVersion(old,invalid);}catch{}assert((await store.getWorkflow('old')).activeVersionId==='v2','failed activation leaves pointer unchanged');
await store.saveTraceEvent({id:'e2',runId:'r',sequence:2,kind:'execute',message:'password=secret',timestamp:1});await store.saveTraceEvent({id:'e1',runId:'r',sequence:1,kind:'verify',message:'ok',timestamp:1});const trace=await store.listTraceEvents('r');assert(trace[0].id==='e1'&&!trace[1].message.includes('secret'),'ordered redacted persisted trace');
const frame=document.querySelector('#product');if(!frame.contentDocument?.querySelector('#search'))await new Promise(r=>frame.onload=r);const doc=frame.contentDocument;
const locator=selector=>({count:async()=>doc.querySelectorAll(selector).length,isVisible:async()=>!doc.querySelector(selector)?.closest('[hidden]'),isEnabled:async()=>!doc.querySelector(selector)?.disabled,fill:async value=>doc.querySelector(selector).value=value,click:async()=>doc.querySelector(selector).click()});const page={locator};const step=(toolName,css)=>({toolName,label:css,timeoutMs:1000,locator:{css,fallbackOrder:['css']}});const signal=new AbortController().signal;
await executeReplayStep(page,step('browser_type','#search'),'#search|肽敏舒',signal);await executeReplayStep(page,step('browser_click','#search-submit'),'#search-submit',signal);await new Promise(r=>setTimeout(r,200));await executeReplayStep(page,step('browser_click','#cart'),'#cart',signal);assert(doc.querySelector('#search').value==='肽敏舒'&&frame.contentWindow.cartCount===1,'real DOM search and cart direct replay');
try{await executeReplayStep(page,step('browser_click','#results button'),'#results button',signal);throw Error('Ambiguity accepted');}catch(e){assert(String(e).includes('Ambiguous'),'multiple products never silently select first');}
document.querySelector('#result').textContent=results.join('\n');
}catch(e){document.querySelector('#result').textContent=results.join('\n')+'\nFAIL '+e.stack;}
</script>
